[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "segmentation_benchmark"
version = "1.0.0"
description = "Semantic and instance segmentation benchmarking across ten architectures on a shared COCO 2017 subset"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Samuel Collins", email = "samuel.collins@students.cau.edu" }]
keywords = ["segmentation", "benchmark", "u-net", "deeplabv3", "segformer", "mask r-cnn", "coco"]

# Ranges rather than the exact pins in requirements.txt. That file exists to
# reproduce the reported numbers; this one describes what the code needs to
# run at all.
dependencies = [
    "numpy>=2.3.5",
    "pandas>=2.2",
    "pillow>=11",
    "matplotlib>=3.9",
    "scipy>=1.14",
    "opencv-python>=4.10",
    "scikit-learn>=1.5",
    "scikit-image>=0.24",
    "torch>=2.5",
    "torchvision>=0.20",
    "pycocotools>=2.0.8",
]

[project.optional-dependencies]
# SegFormer and YOLO segmentation. Separated because the seven other
# architectures train without either, and a reader who only wants the
# convolutional comparison should not have to install both.
transformer = ["transformers>=4.46"]
yolo = ["ultralytics>=8.4"]
# Section 30 complexity accounting.
complexity = ["fvcore>=0.1.5", "thop>=0.1.1"]
dev = ["pytest>=8.3"]
report = ["markdown>=3.7", "beautifulsoup4>=4.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # pycocotools 2.0.11 calls __array__ in a way numpy 2.x deprecates. The
    # decode is correct -- test_mask_utils checks the resulting pixels -- and
    # the warning fires on every annotation, so it is silenced rather than
    # left to bury real ones.
    "ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning",
]
